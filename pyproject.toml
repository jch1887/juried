[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vouch"
version = "0.1.0"
description = "Acceptance testing for LLM features, built for QA teams."
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
vouch = "vouch.cli:main"

[project.entry-points.pytest11]
vouch = "vouch.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
