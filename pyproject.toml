[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juried"
version = "0.3.1"
description = "Acceptance testing for LLM features, with verdicts corrected for the judge's own error rate."
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.11"
authors = [{ name = "jch1887" }]
keywords = ["llm", "testing", "pytest", "qa", "acceptance-testing", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/jch1887/juried"
Repository = "https://github.com/jch1887/juried"
Issues = "https://github.com/jch1887/juried/issues"
Changelog = "https://github.com/jch1887/juried/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# json_schema checks validate the response against a schema file.
schema = ["jsonschema>=4.18"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "jsonschema>=4.18",
    "types-jsonschema",
]

[project.scripts]
juried = "juried.cli:main"

[project.entry-points.pytest11]
juried = "juried.pytest_plugin"

[tool.hatch.build.targets.sdist]
# The README logo and the report screenshot are referenced by URL, and the tests and the
# example project live in the repository; leaving them out keeps the sdist under 200 KB
# (the report logo that the HTML embeds is most of what remains).
exclude = ["juried.png", "docs/report.png", "tests", "examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/juried"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester -m 'not live'"
markers = [
    "live: calls the real provider APIs; needs JURIED_LIVE=1 and the provider keys",
]
